name: Pages

# Wdraza katalog docs/ na GitHub Pages.
#
# WYMAGA JEDNORAZOWEGO WLACZENIA PAGES:
#   Settings -> Pages -> Source: GitHub Actions
# Token Actions nie moze zalozyc strony sam (Resource not accessible by
# integration), wiec enablement:true tu nie pomaga i zostalo usuniete.
on:
  push:
    branches: [claude/engine-v2-assessment-0e2p3w]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
